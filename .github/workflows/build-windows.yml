name: Build Windows CLI and GUI EXEs

on:
  push:
    branches:
      - main
      - feature/pyside6-gui
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Locate Android Platform Tools
        shell: pwsh
        run: |
          $platformTools = Join-Path $env:ANDROID_HOME "platform-tools"

          if (-not (Test-Path "$platformTools\adb.exe")) {
              throw "adb.exe was not found in $platformTools"
          }

          if (-not (Test-Path "$platformTools\AdbWinApi.dll")) {
              throw "AdbWinApi.dll was not found in $platformTools"
          }

          if (-not (Test-Path "$platformTools\AdbWinUsbApi.dll")) {
              throw "AdbWinUsbApi.dll was not found in $platformTools"
          }

          Write-Host "Using Android Platform Tools from: $platformTools"

      - name: Create production environment
        shell: pwsh
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SSH_PASSWORD)) {
              throw "SSH_PASSWORD GitHub secret is missing"
          }

          @"
          RACER_TOOLKIT_STATUS=production
          SSH_PASSWORD=$env:SSH_PASSWORD
          "@ | Set-Content .env

          Write-Host "Production environment file created."

      - name: Build CLI executable
        shell: pwsh
        run: |
          $platformTools = Join-Path $env:ANDROID_HOME "platform-tools"

          uv run pyinstaller `
            --clean `
            --onefile `
            --name racer-team-toolkit `
            --icon "assets/racer-team-toolkit.ico" `
            --add-data ".env;." `
            --add-binary "$platformTools\adb.exe;." `
            --add-binary "$platformTools\AdbWinApi.dll;." `
            --add-binary "$platformTools\AdbWinUsbApi.dll;." `
            src/racer_team_toolkit/main.py

      - name: Build GUI executable
        shell: pwsh
        run: |
          $platformTools = Join-Path $env:ANDROID_HOME "platform-tools"

          uv run pyinstaller `
            --clean `
            --onefile `
            --windowed `
            --name racer-team-toolkit-gui `
            --icon "assets/racer-team-toolkit.ico" `
            --add-data ".env;." `
            --add-binary "$platformTools\adb.exe;." `
            --add-binary "$platformTools\AdbWinApi.dll;." `
            --add-binary "$platformTools\AdbWinUsbApi.dll;." `
            src/racer_team_toolkit/gui/main.py

      - name: Verify executables exist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\racer-team-toolkit.exe")) {
              throw "CLI executable was not created"
          }

          if (-not (Test-Path "dist\racer-team-toolkit-gui.exe")) {
              throw "GUI executable was not created"
          }

          Write-Host "Both Windows executables were created successfully."

      - name: Upload CLI executable
        uses: actions/upload-artifact@v4
        with:
          name: racer-team-toolkit-cli-windows
          path: dist/racer-team-toolkit.exe
          if-no-files-found: error

      - name: Upload GUI executable
        uses: actions/upload-artifact@v4
        with:
          name: racer-team-toolkit-gui-windows
          path: dist/racer-team-toolkit-gui.exe
          if-no-files-found: error
