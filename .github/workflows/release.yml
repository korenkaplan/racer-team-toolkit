name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Set production mode
        shell: pwsh
        run: |
          (Get-Content src/racer_team_toolkit/config.py) `
            -replace 'PROJECT_STATUS = "development"', 'PROJECT_STATUS = "production"' `
            | Set-Content src/racer_team_toolkit/config.py

      - name: Build Windows executable
        run: >
          uv run pyinstaller
          --onefile
          --name racer-team-toolkit
          src/racer_team_toolkit/main.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/racer-team-toolkit.exe"
          --title "${{ github.ref_name }}"
          --generate-notes