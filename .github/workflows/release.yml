name: Build and Release Windows and macOS CLI and GUI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Locate Android Platform Tools
        shell: pwsh
        run: |
          $platformTools = Join-Path $env:ANDROID_HOME "platform-tools"

          if (-not (Test-Path "$platformTools\adb.exe")) {
              throw "adb.exe was not found in $platformTools"
          }

          if (-not (Test-Path "$platformTools\AdbWinApi.dll")) {
              throw "AdbWinApi.dll was not found in $platformTools"
          }

          if (-not (Test-Path "$platformTools\AdbWinUsbApi.dll")) {
              throw "AdbWinUsbApi.dll was not found in $platformTools"
          }

      - name: Create production environment
        shell: pwsh
        run: '"RACER_TOOLKIT_STATUS=production" | Set-Content .env'

      - name: Build CLI executable
        shell: pwsh
        run: |
          $platformTools = Join-Path $env:ANDROID_HOME "platform-tools"

          uv run pyinstaller `
            --clean `
            --onefile `
            --name racer-team-toolkit `
            --icon "assets/racer-team-toolkit.ico" `
            --add-data ".env;." `
            --add-binary "$platformTools\adb.exe;." `
            --add-binary "$platformTools\AdbWinApi.dll;." `
            --add-binary "$platformTools\AdbWinUsbApi.dll;." `
            src/racer_team_toolkit/main.py

      - name: Build GUI executable
        shell: pwsh
        run: |
          $platformTools = Join-Path $env:ANDROID_HOME "platform-tools"

          uv run pyinstaller `
            --clean `
            --onefile `
            --windowed `
            --name racer-team-toolkit-gui `
            --icon "assets/racer-team-toolkit.ico" `
            --add-data ".env;." `
            --add-binary "$platformTools\adb.exe;." `
            --add-binary "$platformTools\AdbWinApi.dll;." `
            --add-binary "$platformTools\AdbWinUsbApi.dll;." `
            src/racer_team_toolkit/gui/main.py

      - name: Verify executables exist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\racer-team-toolkit.exe")) {
              throw "CLI executable was not created"
          }

          if (-not (Test-Path "dist\racer-team-toolkit-gui.exe")) {
              throw "GUI executable was not created"
          }

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: racer-team-toolkit-windows-release
          path: dist/*.exe
          if-no-files-found: error

  build-macos:
    uses: ./.github/workflows/build-macos.yml

  publish-release:
    needs: [build-release, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --title "$RELEASE_TAG" --generate-notes
