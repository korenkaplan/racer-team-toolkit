name: Build Windows GUI EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-gui:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Locate Android Platform Tools
        shell: pwsh
        run: |
          $platformTools = Join-Path $env:ANDROID_HOME "platform-tools"
          if (-not (Test-Path "$platformTools\adb.exe")) { throw "adb.exe not found" }
          if (-not (Test-Path "$platformTools\AdbWinApi.dll")) { throw "AdbWinApi.dll not found" }
          if (-not (Test-Path "$platformTools\AdbWinUsbApi.dll")) { throw "AdbWinUsbApi.dll not found" }

      - name: Create production environment
        shell: pwsh
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SSH_PASSWORD)) { throw "SSH_PASSWORD GitHub secret is missing" }
          "RACER_TOOLKIT_STATUS=production`nSSH_PASSWORD=$env:SSH_PASSWORD" | Set-Content .env

      - name: Build Windows GUI executable
        shell: pwsh
        run: |
          $platformTools = Join-Path $env:ANDROID_HOME "platform-tools"
          uv run pyinstaller --onefile --windowed --name racer-team-toolkit-gui --icon "assets/racer-team-toolkit.ico" --add-data ".env;." --add-binary "$platformTools\adb.exe;." --add-binary "$platformTools\AdbWinApi.dll;." --add-binary "$platformTools\AdbWinUsbApi.dll;." src/racer_team_toolkit/gui/main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\racer-team-toolkit-gui.exe")) { throw "Windows GUI executable was not created" }

      - name: Upload Windows GUI executable
        uses: actions/upload-artifact@v4
        with:
          name: racer-team-toolkit-gui-windows
          path: dist/racer-team-toolkit-gui.exe
          if-no-files-found: error
