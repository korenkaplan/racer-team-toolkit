name: GUI Branch Checks

on:
  push:
    branches:
      - feature/pyside6-gui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply Ruff fixes
        run: |
          uv run ruff check . --fix
          uv run ruff format .

      - name: Commit formatting fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply Ruff formatting"
          git push

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Import GUI modules
        run: >
          uv run python -c
          "from racer_team_toolkit.gui.main_window import MainWindow;
          print('GUI imports OK:', MainWindow.__name__)"
