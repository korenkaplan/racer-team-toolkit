[project]
name = "racer-team-toolkit"
version = "0.1.0"
description = "Extract and process references from racing team data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=5.0.0",
    "psutil>=7.2.2",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
racer-team-toolkit = "racer_team_toolkit.main:main"
racer-team-toolkit-gui = "racer_team_toolkit.gui.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "reff_integration: REFF extractor integration tests",
    "adb_integration: tests that require the fixed physical ADB devices",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

include = [
    "src",
    "tests",
]
[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pyinstaller>=6.22.2",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "ruff>=0.16.5",
]
